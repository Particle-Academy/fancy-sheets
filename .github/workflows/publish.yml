name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Release gate: a tag with no CHANGELOG entry fails HERE, before the
      # package reaches the registry. A published version whose changes are
      # undocumented cannot be fixed by editing the changelog afterwards — the
      # tarball is already out, and the agent upgrading into it has no way to
      # learn what broke.
      - name: Changelog entry for this tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::No CHANGELOG.md. Every package keeps one."
            exit 1
          fi
          if ! grep -qE "^## +\\[?v?${VERSION}\\]?" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for ${VERSION}. Add one — say what a consumer must DO — then re-tag."
            exit 1
          fi
          echo "Found changelog entry for ${VERSION}."


      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # The package uses `workspace:*` for @particle-academy/react-fancy in
      # devDependencies (resolved via pnpm in the monorepo). Standalone CI
      # has no workspace, so rewrite the protocol to a plain version range.
      - name: Rewrite workspace protocol
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            for (const section of ['dependencies', 'devDependencies', 'peerDependencies']) {
              if (!pkg[section]) continue;
              for (const [name, version] of Object.entries(pkg[section])) {
                if (typeof version === 'string' && version.startsWith('workspace:')) {
                  pkg[section][name] = version.slice('workspace:'.length);
                }
              }
            }
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      # Trusted Publishing (OIDC) requires npm 11.5.1+; bundled npm in
      # the runner is 10.x. Use npx to fetch a fresh npm just for publish.
      - name: Publish
        run: npx -y npm@11.18.0 publish --provenance --access public
